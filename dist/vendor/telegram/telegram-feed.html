<!doctype html>
<!-- Демо-воспроизведение сохранённого вывода новостного бота. Оригинальная разметка и стили;
     палитра и метрики сверены со справочными значениями Telegram (тёмная тема) без копирования файлов. -->
<html lang="ru" data-demo-note="replay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Новостной бот · Telegram — демо-воспроизведение</title>
<style>
  /* Справочные значения палитры: ночная тема Telegram (#0e1621 фон чата, #17212b панели,
     #182533 входящий пузырь, #7f91a4 вторичный текст), акцент — ночной синий #3e88f7. */
  :root{
    --tg-bg:#0e1621;            /* фон чата */
    --tg-outer:#0b1017;         /* поле вокруг окна на широких экранах */
    --tg-panel:#17212b;         /* шапка и панель ввода */
    --tg-bubble:#182533;        /* пузырь входящего сообщения */
    --tg-text:#ffffff;
    --tg-muted:#7f91a4;
    --tg-accent:#3e88f7;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--tg-outer);color:var(--tg-text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .tg-app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;min-height:420px;
    max-width:920px;margin:0 auto;background:var(--tg-bg);
    border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);
  }

  /* ── Шапка чата ─────────────────────────────────────────── */
  .tg-header{
    flex:none;display:flex;align-items:center;gap:12px;
    height:56px;padding:0 10px 0 8px;background:var(--tg-panel);
    box-shadow:0 1px 0 rgba(0,0,0,.3);
  }
  .tg-iconbtn{
    display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;
    background:transparent;color:var(--tg-muted);cursor:default;
  }
  .tg-iconbtn svg{width:22px;height:22px}
  .tg-avatar{
    flex:none;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#ff885e,#ff516a);
  }
  .tg-avatar svg{width:20px;height:20px}
  .tg-titles{flex:1;min-width:0;line-height:1.2}
  .tg-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tg-status{font-size:13px;color:var(--tg-muted)}
  .tg-status.is-typing{color:var(--tg-accent)}

  /* ── Область чата ───────────────────────────────────────── */
  .tg-chat{flex:1;position:relative;overflow:hidden}
  .tg-scroll{
    position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
    padding:14px 14px 6px;
    display:flex;flex-direction:column;
  }
  .tg-scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  .tg-scroll::-webkit-scrollbar{width:6px}
  .tg-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .tg-scroll::-webkit-scrollbar-track{background:transparent}

  .tg-msgs{
    display:flex;flex-direction:column;gap:6px;
    margin-top:auto;             /* при малом наполнении лента прижата к низу, как в чате */
  }
  .tg-date{
    align-self:center;margin:2px 0 6px;padding:4px 12px;border-radius:14px;
    background:rgba(9,18,28,.55);font-size:13px;color:#fff;
  }

  @keyframes tg-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tg-msg,.tg-typing{display:flex;justify-content:flex-start;animation:tg-in .3s ease both}

  .tg-bubble{
    position:relative;max-width:min(80%,540px);
    background:var(--tg-bubble);
    border-radius:16px;border-bottom-left-radius:4px;
    padding:10px 14px 8px;
    box-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  /* Хвостик входящего пузыря: оригинальный SVG-клин, прилегающий к левой стенке */
  .tg-msg .tg-bubble::before,
  .tg-typing .tg-bubble::before{
    content:"";position:absolute;left:-13px;bottom:0;width:13px;height:18px;
    background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='13' height='18' viewBox='0 0 13 18'%3E%3Cpath d='M13 0C5 1.5 1 9 0 18L13 18Z' fill='%23182533'/%3E%3C/svg%3E") no-repeat;
    background-size:13px 18px;
  }

  .tg-title{font-size:17px;font-weight:600;line-height:1.3;margin:2px 0 6px}
  .tg-p{margin:0 0 8px}
  .tg-h{font-size:15px;font-weight:600;margin:6px 0 2px}
  .tg-ul{margin:2px 0 8px;padding:0;list-style:none}
  .tg-li{position:relative;padding-left:16px;margin:4px 0}
  .tg-li::before{
    content:"";position:absolute;left:2px;top:.6em;
    width:5px;height:5px;border-radius:50%;background:var(--tg-muted);
  }

  .tg-photo{
    border-radius:12px;overflow:hidden;background:#0a0f16;
    opacity:0;transform:translateY(8px);
    transition:opacity .55s ease,transform .55s ease;
  }
  .tg-photo.is-on{opacity:1;transform:none}
  .tg-photo img{display:block;width:100%;height:auto}

  .tg-meta{
    display:flex;justify-content:flex-end;align-items:center;gap:8px;
    margin:2px 2px 0;font-size:12px;color:var(--tg-muted);line-height:1;
  }
  .tg-views{display:inline-flex;align-items:center;gap:4px}
  .tg-ico{width:14px;height:14px}


  /* ── Рич-пост канала (как в настоящем Telegram) ── */
  .tg-post{position:relative;padding:4px 6px 6px 10px}
  .tg-post-name{font-weight:600;font-size:14px;color:#e17076;margin:2px 0 10px}
  .tg-post-title{font-size:17px;font-weight:600;line-height:1.35;margin:0 0 10px;min-height:1.2em}
  .tg-post-h{font-size:16px;font-weight:600;line-height:1.4;margin:16px 0 8px}
  .tg-post-p{font-size:15px;line-height:1.5;margin:0 0 10px;color:#eef2f5}
  .tg-post-li{position:relative;padding-left:16px;margin:5px 0;font-size:15px;line-height:1.5;color:#eef2f5}
  .tg-post-li::before{content:"•";position:absolute;left:3px;color:var(--tg-muted)}
  .tg-post .tg-photo{margin:4px 0 12px}
  .tg-post-links{display:none;flex-direction:column;gap:3px;margin:14px 0 4px}
  .tg-post-links a{color:#e8a33d;text-decoration:none;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
  .tg-post-links a:hover{text-decoration:underline}
  .tg-post-tags{color:#e8a33d;font-size:14.5px;line-height:1.5}
  .tg-post .tg-meta{margin:6px 2px 0}

  @keyframes tg-blink{50%{opacity:0}}
  .tg-caret{
    display:inline-block;width:2px;height:1em;margin-left:1px;
    background:var(--tg-accent);vertical-align:-2px;
    animation:tg-blink 1s steps(1) infinite;
  }

  /* ── Индикатор «печатает…» ──────────────────────────────── */
  @keyframes tg-dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
  .tg-bubble--typing{padding:12px 16px;border-bottom-left-radius:4px}
  .tg-dots{display:inline-flex;gap:4px}
  .tg-dots i{width:7px;height:7px;border-radius:50%;background:var(--tg-muted);animation:tg-dot 1.1s ease-in-out infinite}
  .tg-dots i:nth-child(2){animation-delay:.15s}
  .tg-dots i:nth-child(3){animation-delay:.3s}

  /* ── Финал ленты ────────────────────────────────────────── */
  .tg-end{
    align-self:center;display:flex;flex-direction:column;align-items:center;gap:7px;
    margin:10px 0 12px;opacity:0;transition:opacity .5s ease;pointer-events:none;
  }
  .tg-end.is-visible{opacity:1;pointer-events:auto}
  .tg-note{font-size:12px;color:var(--tg-muted)}

  /* ── Панель ввода: после прогона становится живой ── */
  .tg-inputbar{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:7px 10px;background:var(--tg-panel);
  }
  .tg-field{
    flex:1;display:flex;align-items:center;gap:10px;
    background:var(--tg-bg);border-radius:21px;padding:12px 16px;
    color:var(--tg-muted);font-size:15px;user-select:none;
  }
  .tg-field svg{width:22px;height:22px;flex:none}
  .tg-field-input{
    flex:1;min-width:0;background:transparent;border:0;outline:none;
    color:var(--tg-text);font:15px inherit;font-family:inherit;
  }
  .tg-field-input::placeholder{color:var(--tg-muted)}
  .tg-field-input:disabled{cursor:default}
  .tg-send{
    flex:none;width:44px;height:44px;border:0;border-radius:50%;
    display:grid;place-items:center;background:var(--tg-accent);color:#fff;cursor:default;
  }
  .tg-send svg{width:22px;height:22px}
  .tg-inputbar.is-live .tg-field{cursor:text}
  .tg-inputbar.is-live .tg-send{cursor:pointer}
  .tg-send:disabled{opacity:.5}

  /* ── Исходящее сообщение посетителя ── */
  .tg-msg--out{justify-content:flex-end}
  .tg-msg--out .tg-bubble{
    background:#2b5278;border-bottom-left-radius:16px;border-bottom-right-radius:4px;
    overflow-wrap:anywhere;
  }
  .tg-msg--out .tg-bubble::before{
    left:auto;right:-13px;transform:scaleX(-1);
    background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='13' height='18' viewBox='0 0 13 18'%3E%3Cpath d='M13 0C5 1.5 1 9 0 18L13 18Z' fill='%232b5278'/%3E%3C/svg%3E") no-repeat;
    background-size:13px 18px;
  }
  .tg-msg--err .tg-bubble{background:#332026;border-color:#5c3038;border-style:solid;border-width:1px}
  .tg-msg--err .tg-bubble::before{background:none}

  .tg-noscript{padding:20px;text-align:center;color:var(--tg-muted)}

  /* ── Reduced motion: без анимаций, контент показывается сразу ── */
  @media (prefers-reduced-motion: reduce){
    .tg-msg,.tg-typing,.tg-caret,.tg-dots i{animation:none!important}
    .tg-photo,.tg-end{transition:none!important}
    .tg-caret{display:none}
  }
</style>
</head>
<body>
<div class="tg-app" id="tgApp">
  <header class="tg-header">
    <button class="tg-iconbtn" type="button" tabindex="-1" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="tg-avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M5 4h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-4.2l-2.8 2-2.8-2H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 4v1.6h5.2V8H6Zm6.8 0v1.6H18V8h-5.2ZM6 10.4V12h5.2v-1.6H6Zm6.8 0V12H18v-1.6h-5.2ZM6 13.6v1.6h3.6v-1.6H6Zm5.2 0v1.6H18v-1.6h-6.8Z"/></svg>
    </div>
    <div class="tg-titles">
      <div class="tg-name">Новостной бот</div>
      <div class="tg-status" id="tgStatus">бот</div>
    </div>
    <button class="tg-iconbtn" type="button" tabindex="-1" aria-label="Поиск">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="tg-iconbtn" type="button" tabindex="-1" aria-label="Ещё">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>
    </button>
  </header>

  <main class="tg-chat">
    <div class="tg-scroll" id="tgScroll">
      <div class="tg-msgs" id="tgMsgs"></div>
      <div class="tg-end" id="tgEnd">
        <div class="tg-note">Сохранённая публикация новостного бота</div>
      </div>
    </div>
  </main>

  <footer class="tg-inputbar is-live" id="tgInputBar" aria-hidden="false">
    <div class="tg-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8 8a5.4 5.4 0 0 1-7.6-7.6l8.4-8.4a3.6 3.6 0 0 1 5.1 5.1l-8.2 8.2a1.8 1.8 0 0 1-2.6-2.6l7.6-7.5"/></svg>
      <input class="tg-field-input" id="tgInput" type="text" placeholder="Попробуйте бота — вставьте ссылку на любую статью" aria-label="Сообщение боту">
    </div>
    <button class="tg-send" id="tgSend" type="button" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.6 12.2 1.8-12.2 1.8.1 6.6Z"/></svg>
    </button>
  </footer>

  <noscript><div class="tg-noscript">Для показа живой ленты включите JavaScript.</div></noscript>
</div>

<script>
(function(){
  'use strict';

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FALLBACK_IMG = '../../assets/news-result.png';

  /* Рич-пост — дословно из сохранённого вывода новостного бота (обзор Razer Mako).
     Структура повторяет настоящие публикации бота: заголовок, фото, разделы со списками, ссылки. */
  var POST = {
    name: 'Новостной бот',
    date: '14 октября',
    time: '20:15',
    views: '1,4K',
    title: '📰 Razer представила линейку настольных игровых колонок Mako',
    elements: [
      { t:'img', src:'img/mako-kv.png', alt:'Пресс-изображение линейки игровых колонок Razer Mako' },
      { t:'p', text:'Razer анонсировала линейку компактных настольных игровых колонок Mako из двух моделей — Mako и Mako X. Она рассчитана на геймеров, которым нужно более полное звучание и глубокий бас в компактном форм-факторе для современных игровых столов. Главное различие: Mako — конфигурация 2.1 с отдельным сабвуфером и более масштабной подсветкой, Mako X — 2.0 с пассивными радиаторами и меньшим корпусом.' },
      { t:'h', text:'Mako: особенности и звук' },
      { t:'ul', items:[
        '2.1-канальная конфигурация: настроенные 2,75-дюймовые широкополосные драйверы и отдельный фронтальный 3,5-дюймовый сабвуфер.',
        'Мощность 40 Вт RMS и 60 Вт пиковой, частотный диапазон с нижней границей 45 Гц.',
        'Наклонная конструкция направляет звук к уровню ушей, а 7.1-виртуальное объемное звучание расширяет сцену для игр, фильмов и музыки.'
      ]},
      { t:'h', text:'Mako X: особенности и звук' },
      { t:'ul', items:[
        '2.0-канальная конфигурация: настроенные 2,75-дюймовые широкополосные драйверы и встроенные пассивные радиаторы для расширения низких частот.',
        'Мощность до 30 Вт RMS и 45 Вт пиковой, частотный диапазон с нижней границей 60 Гц.',
        'Наклонная конструкция и 7.1-виртуальное объемное звучание; также может работать от стандартного USB-питания до 15 Вт.'
      ]},
      { t:'img', src:'img/mako-1.png', alt:'Игровые колонки Razer Mako' },
      { t:'h', text:'Подсветка' },
      { t:'ul', items:[
        'Mako: заднепроекционная Razer Chroma RGB подсвечивает стену за столом.',
        'Заявлено 16,8 млн цветов и реактивные эффекты в более чем 300 играх с поддержкой Chroma.',
        'Mako X: 10-зонная нижняя подсветка Razer Chroma RGB создает мягкое свечение под колонками.'
      ]},
      { t:'h', text:'Подключение' },
      { t:'ul', items:[
        'Один кабель USB-C передает питание и аудио.',
        'При подключении к совместимому источнику USB-C мощностью 30 Вт и выше доступна более высокая выходная мощность.',
        'Альтернативные подключения: Bluetooth 5.3 и 3,5 мм.'
      ]},
      { t:'img', src:'img/mako-x.png', alt:'Игровые колонки Razer Mako X' }
    ],
    links: [
      { label:'📄 Оригинальный пресс-релиз Razer Newsroom', url:'https://www.razer.com/newsroom/product-news/mako-line' }
    ],
    tags: '#Razer #RazerMako #RazerMakoX'
  };

  /* Темп живого набора: сохранённая публикация показывается сразу,
     посимвольно бот пишет только ответ на статью посетителя. */
  var T = { reply: 4500 };

  var EYE_SVG = '<svg class="tg-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 6C7.2 6 3.4 9.3 1.9 12 3.4 14.7 7.2 18 12 18s8.6-3.3 10.1-6C20.6 9.3 16.8 6 12 6Zm0 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>';

  var root = document.getElementById('tgApp');
  var scrollEl = document.getElementById('tgScroll');
  var msgsEl = document.getElementById('tgMsgs');
  var statusEl = document.getElementById('tgStatus');
  var endEl = document.getElementById('tgEnd');
  var inputBar = document.getElementById('tgInputBar');
  var tgInput = document.getElementById('tgInput');
  var tgSend = document.getElementById('tgSend');

  var ENDPOINT = 'https://www.true-order.ru/newsbot-demo/convert';
  var USED_KEY = 'tg-demo-used';
  var USED_NOTE = 'Демо доступно раз в сутки';

  var gen = 0; // поколение прогона: повтор инвалидирует предыдущую анимацию

  function el(tag, cls){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }
  function stale(token){ return token.gen !== gen; }

  function usedToday(){
    try {
      var v = JSON.parse(localStorage.getItem(USED_KEY) || 'null');
      return !!(v && v.at && Date.now() - v.at < 86400000);
    } catch (e) { return false; }
  }
  function markUsed(){
    try { localStorage.setItem(USED_KEY, JSON.stringify({ at: Date.now() })); } catch (e) {}
  }
  function nowTime(){
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function setInputEnabled(on, placeholder){
    tgInput.disabled = !on;
    tgSend.disabled = !on;
    tgInput.placeholder = placeholder || (on ? 'Попробуйте бота — вставьте ссылку на любую статью' : 'Написать сообщение…');
    inputBar.classList.toggle('is-live', !!on);
    inputBar.setAttribute('aria-hidden', on ? 'false' : 'true');
  }

  var pinned = true;
  scrollEl.addEventListener('scroll', function(){
    pinned = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 160;
  }, { passive:true });

  function autoScroll(force){
    if (!pinned && !force) return;
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }

  function setStatus(typing){
    statusEl.textContent = typing ? 'печатает…' : 'бот';
    statusEl.classList.toggle('is-typing', !!typing);
  }

  function showTyping(){
    var row = el('div','tg-typing');
    row.innerHTML = '<div class="tg-bubble tg-bubble--typing"><span class="tg-dots"><i></i><i></i><i></i></span></div>';
    msgsEl.appendChild(row);
    autoScroll(true);
    setStatus(true);
    return row;
  }

  /* Сборка рич-поста: все блоки скрыты, текстовые собираются в leaves для посимвольного набора */
  function buildPost(post){
    var wrap = el('div','tg-post');
    var name = el('div','tg-post-name');
    name.textContent = post.name;
    wrap.appendChild(name);

    var leaves = [];
    function push(node, text){
      node.style.display = 'none';
      wrap.appendChild(node);
      leaves.push({ node: node, text: text || '', arr: Array.from(text || '') });
    }

    var title = el('div','tg-post-title');
    push(title, post.title);

    post.elements.forEach(function(elm){
      if (elm.t === 'img'){
        var fig = el('div','tg-photo');
        // до своего хода в наборе фото не занимают место в раскладке,
        // иначе autoScroll уезжает в пустую зону заглушек и кадр пустеет
        fig.style.display = 'none';
        fig.style.transitionDelay = '0ms';
        var img = document.createElement('img');
        img.src = elm.src;
        img.alt = elm.alt || '';
        img.decoding = 'async';
        img.addEventListener('error', function(){
          if (!img.dataset.fb){ img.dataset.fb = '1'; img.src = FALLBACK_IMG; }
        });
        fig.appendChild(img);
        wrap.appendChild(fig);
        leaves.push({ node: fig, img: true, text: '', arr: [] });
      } else if (elm.t === 'ul'){
        elm.items.forEach(function(text){
          var li = el('div','tg-post-li');
          push(li, text);
        });
      } else {
        push(el('div', elm.t === 'h' ? 'tg-post-h' : 'tg-post-p'), elm.text);
      }
    });

    var links = el('div','tg-post-links');
    (post.links || []).forEach(function(l){
      var a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = l.label;
      links.appendChild(a);
    });
    if (post.tags){
      var tags = el('div','tg-post-tags');
      tags.textContent = post.tags;
      links.appendChild(tags);
    }
    if ((post.links || []).length || post.tags){
      wrap.appendChild(links);
      leaves.push({ node: links, block: true, text: '', arr: [] });
    }

    var meta = el('div','tg-meta');
    meta.style.visibility = 'hidden';
    meta.innerHTML = '<span class="tg-views">' + EYE_SVG + '<span>' + post.views + '</span></span>'
                   + '<span class="tg-time">' + post.time + '</span>';
    wrap.appendChild(meta);
    return { wrap: wrap, leaves: leaves, meta: meta };
  }

  function showLeaf(l){
    if (l.img){
      // двойной rAF: переход opacity срабатывает и после display:none
      l.node.style.display = '';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ l.node.classList.add('is-on'); });
      });
      return;
    }
    l.node.style.display = l.block ? 'flex' : '';
    if (!l.block) l.node.textContent = l.text;
  }

  /* Посимвольный набор по кодпоинтам; нулевые листья (фото, ссылки) просто открываются */
  function typeInto(leaves, durMs, token){
    return new Promise(function(done){
      var total = leaves.reduce(function(s,l){ return s + l.arr.length; }, 0);
      var per = total ? Math.min(16, Math.max(6, durMs / total)) : 1;
      var caret = el('span','tg-caret');
      var idx = 0, pos = 0, shown = 0, active = null;
      var begin = performance.now();

      function activate(){
        if (active && active.node.contains(caret)) active.node.removeChild(caret);
        active = leaves[idx];
        showLeaf(active);
        if (!active.img && !active.block){
          active.node.textContent = '';
          active.node.appendChild(caret);
        }
      }
      function frame(now){
        if (stale(token)){ done(false); return; }
        var target = total ? Math.min(total, Math.floor((now - begin) / per)) : 0;
        while (idx < leaves.length && (shown < target || leaves[idx].arr.length === 0)){
          var l = leaves[idx];
          if (l.arr.length === 0){
            if (!l.done){ l.done = true; showLeaf(l); }
            idx++; pos = 0;
            continue;
          }
          if (pos === 0) activate();
          pos++; shown++;
          active.node.textContent = l.arr.slice(0, pos).join('');
          active.node.appendChild(caret);
          if (pos >= l.arr.length){ idx++; pos = 0; }
        }
        autoScroll();
        if (idx >= leaves.length){
          if (active && active.node.contains(caret)) active.node.removeChild(caret);
          done(!stale(token));
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  function finish(){
    endEl.classList.add('is-visible');
    autoScroll(true);
    if (usedToday()){
      setInputEnabled(false, USED_NOTE);
    } else {
      setInputEnabled(true);
    }
  }

  function renderSimple(text, cls, time, views){
    var row = el('div', cls || 'tg-msg');
    var bubble = el('div', 'tg-bubble');
    var p = el('p', 'tg-p');
    p.style.margin = '0';
    p.textContent = text;
    bubble.appendChild(p);
    var meta = el('div', 'tg-meta');
    meta.style.visibility = 'visible';
    meta.innerHTML = (views ? '<span class="tg-views">' + EYE_SVG + '<span>' + views + '</span></span>' : '')
                   + '<span class="tg-time">' + time + '</span>';
    bubble.appendChild(meta);
    row.appendChild(bubble);
    msgsEl.appendChild(row);
    autoScroll(true);
    return row;
  }

  /* Ответ бота на статью посетителя — тем же рич-форматом, с живым посимвольным набором */
  async function renderBotPost(data){
    var token = { gen: gen };
    var post = {
      name: 'Новостной бот',
      time: nowTime(),
      views: '1',
      title: data.title || '',
      elements: (data.messages || []).map(function(m){ return { t:'p', text:m }; }),
      links: [],
      tags: ''
    };
    var built = buildPost(post);
    msgsEl.appendChild(built.wrap);
    autoScroll(true);
    await typeInto(built.leaves, T.reply, token);
    if (stale(token)) return;
    built.meta.style.visibility = '';
    setStatus(false);
    autoScroll();
  }

  /* Сохранённая публикация показывается сразу: смотреть набор демо-текста
     незачем, живой набор оставлен только для ответов на статьи посетителя */
  function play(){
    msgsEl.textContent = '';
    endEl.classList.remove('is-visible');
    var date = el('div','tg-date');
    date.textContent = POST.date;
    msgsEl.appendChild(date);

    var built = buildPost(POST);
    built.leaves.forEach(function(l){ l.done = true; showLeaf(l); });
    built.meta.style.visibility = '';
    msgsEl.appendChild(built.wrap);
    autoScroll(true);
    finish();
  }

  function start(){
    gen++;
    play();
  }

  /* Демо на своей статье: посетитель шлёт ссылку/текст — бот отвечает публикацией */
  function sendUser(){
    if (tgInput.disabled) return;
    var text = tgInput.value.trim();
    if (!text) return;
    var isUrl = /^https?:\/\//i.test(text);
    if (!isUrl && text.length < 200){
      renderSimple('Пришлите ссылку на статью целиком или вставьте её текст (хотя бы несколько абзацев).', 'tg-msg tg-msg--err', nowTime(), null);
      tgInput.value = '';
      return;
    }
    renderSimple(text, 'tg-msg tg-msg--out', nowTime(), null);
    tgInput.value = '';
    setInputEnabled(false, 'печатает…');
    var ind = showTyping();
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(isUrl ? { url: text } : { text: text.slice(0, 18000) })
    }).then(function(r){ return r.json(); }).then(function(body){
      ind.remove();
      if (!body.ok){
        setStatus(false);
        renderSimple('Не получилось: ' + (body.error || 'попробуйте другую статью') + '.', 'tg-msg tg-msg--err', nowTime(), null);
        if (!usedToday()) setInputEnabled(true);
        return;
      }
      markUsed();
      setInputEnabled(false, USED_NOTE);
      renderBotPost(body); // статус «печатает…» гаснет в конце набора ответа
    }).catch(function(){
      ind.remove();
      setStatus(false);
      renderSimple('Сервис недоступен — попробуйте позже.', 'tg-msg tg-msg--err', nowTime(), null);
      if (!usedToday()) setInputEnabled(true);
    });
  }
  tgSend.addEventListener('click', sendUser);
  tgInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendUser(); });

  /* Старт по IntersectionObserver, когда блок появился в кадре */
  var started = false;
  function boot(){
    if (started) return;
    started = true;
    // пост показывается сразу и сразу скроллится к низу — ждём загрузки фото,
    // иначе их высоты приходят позже и вьюпорт остаётся не на месте
    var pending = [];
    POST.elements.forEach(function(elm){
      if (elm.t === 'img'){
        var i = new Image();
        i.src = elm.src;
        pending.push(new Promise(function(res){
          if (i.complete) res();
          else { i.onload = res; i.onerror = res; }
        }));
      }
    });
    Promise.all(pending).then(start);
  }
  if (reduced || !('IntersectionObserver' in window)){
    boot();
  } else {
    var io = new IntersectionObserver(function(entries){
      if (entries.some(function(e){ return e.isIntersecting; })){
        io.disconnect();
        boot();
      }
    }, { threshold: 0.3 });
    io.observe(root);
  }
})();
</script>
